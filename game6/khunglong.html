<!DOCTYPE html>
<html>
<head>
  <title>Dino Game</title>
  <style>
    canvas {
      background: #f7f7f7;
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>

<canvas id="game" width="800" height="200"></canvas>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    
    // Load ảnh
    const dinoImg = new Image();
    dinoImg.src = "khunglong.webp";
    
    const cactusImg = new Image();
    cactusImg.src = "xuongrong.avif";
    
    const birdImg = new Image();
    birdImg.src = "chim.jfif";
    
    let dino = { x: 50, y: 150, w: 44, h: 47, dy: 0, jumping: false };
    
    let gravity = 1;
    let obstacles = [];
    let spawnTimer = 0;
    let spawnDelay = 80;
    
    let score = 0;
    let speed = 5;
    
    document.addEventListener("keydown", () => {
      if (!dino.jumping) {
        dino.dy = -15;
        dino.jumping = true;
      }
    });
    
    function spawnObstacle() {
      let type = "cactus";
    
      if (score > 300 && Math.random() < 0.3) {
        type = "bird";
      }
    
      if (type === "cactus") {
        obstacles.push({
          x: 800,
          y: 150,
          w: 25,
          h: 50,
          type: "cactus"
        });
      } else {
        obstacles.push({
          x: 800,
          y: 120 + Math.random() * 30,
          w: 46,
          h: 40,
          type: "bird"
        });
      }
    
      spawnDelay = 60 + Math.random() * 80;
      spawnTimer = 0;
    }
    
    function update() {
      spawnTimer++;
      score += 0.1;
      speed = 5 + score / 200;
    
      // Dino physics
      dino.dy += gravity;
      dino.y += dino.dy;
    
      if (dino.y >= 150) {
        dino.y = 150;
        dino.jumping = false;
      }
    
      // Spawn obstacle
      if (spawnTimer > spawnDelay) {
        spawnObstacle();
      }
    
      // Move obstacles
      obstacles.forEach(o => o.x -= speed);
    
      // Collision
      obstacles.forEach(o => {
        if (
          dino.x < o.x + o.w &&
          dino.x + dino.w > o.x &&
          dino.y < o.y + o.h &&
          dino.y + dino.h > o.y
        ) {
          alert("Game Over! Score: " + Math.floor(score));
          document.location.reload();
        }
      });
    
      obstacles = obstacles.filter(o => o.x > -50);
    }
    
    function draw() {
      ctx.clearRect(0, 0, 800, 200);
    
      // Score
      ctx.fillStyle = "black";
      ctx.fillText("Score: " + Math.floor(score), 650, 20);
    
      // Dino
      ctx.drawImage(dinoImg, dino.x, dino.y, dino.w, dino.h);
    
      // Obstacles
      obstacles.forEach(o => {
        if (o.type === "cactus") {
          ctx.drawImage(cactusImg, o.x, o.y, o.w, o.h);
        } else {
          ctx.drawImage(birdImg, o.x, o.y, o.w, o.h);
        }
      });
    }
    
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    // Đảm bảo ảnh load xong mới chạy
    dinoImg.onload = () => gameLoop();
    </script>

</body>
</html>
